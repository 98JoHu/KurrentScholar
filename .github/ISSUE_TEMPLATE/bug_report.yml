name: Bug report
description: Report a reproducible problem without sharing restricted manuscript content
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Remove personal paths and do not attach restricted documents.
    validations:
      required: true
  - type: input
    attributes:
      label: KurrentScholar version
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps

