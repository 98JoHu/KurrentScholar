[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kurrentscholar"
version = "1.1.0"
description = "Offline-first desktop transcription for historical German Kurrent manuscripts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Jonas Hummel", email = "jonas.hummel@kit.edu"}]
maintainers = [{name = "Jonas Hummel", email = "jonas.hummel@kit.edu"}]
keywords = ["handwriting recognition", "Kurrent", "HTR", "digital humanities", "TrOCR"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "huggingface-hub==0.28.1",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "openpyxl==3.1.5",
  "pillow==11.1.0",
  "platformdirs==4.3.6",
  "pypdfium2==4.30.0",
  "pyside6==6.8.2.1",
  "python-docx==1.1.2",
  "safetensors==0.5.2",
  # PyTorch stopped publishing Intel macOS wheels after 2.2.2.
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch==2.5.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "transformers==4.48.3",
  "truststore==0.10.4",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]==7.6.10",
  "pyinstaller==6.11.1",
  "pytest==8.3.4",
  "pytest-qt==4.4.0",
  "ruff==0.9.3",
]

[project.scripts]
kurrentscholar = "kurrentscholar.app:main"
kurrentscholar-evaluate = "kurrentscholar.evaluation:main"

[project.urls]
Homepage = "https://github.com/98JoHu/KurrentScholar"
Documentation = "https://github.com/98JoHu/KurrentScholar#readme"
Issues = "https://github.com/98JoHu/KurrentScholar/issues"
Source = "https://github.com/98JoHu/KurrentScholar"

[tool.hatch.build.targets.wheel]
packages = ["src/kurrentscholar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["real_model: downloads/loads the pinned model", "gui: requires Qt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

