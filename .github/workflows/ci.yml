name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Test the operating systems KurrentScholar actually distributes for.
        # macOS application signing is intentionally confined to the release workflow.
        os: [windows-latest, macos-15]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.24"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -m "not real_model" --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

